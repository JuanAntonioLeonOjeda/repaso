# One service: the static web app. Open http://localhost:${REPASO_PORT:-3100}
name: repaso

services:
  web:
    build: .
    ports:
      - "${REPASO_PORT:-3100}:8080"
    restart: unless-stopped
    volumes:
      # TFM images from LUMOS patients: generated locally, never baked into the image (ADR-0004).
      - ./public/tfm-local:/usr/share/nginx/html/tfm-local:ro
