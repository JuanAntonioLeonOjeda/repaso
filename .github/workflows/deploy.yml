# Builds the app and publishes it on GitHub Pages under /repaso/ (ADR-0007).
# Runs on every push to main and on demand. The local Docker image is unaffected.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels nothing that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - name: Build for /repaso/
        run: pnpm build
        env:
          BASE_PATH: /repaso/
      # Pages has no SPA fallback: serving index.html as the 404 page lets deep links
      # (/repaso/vision/evaluar) load the app, which then routes on the client.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
