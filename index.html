<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Repaso del máster: resúmenes, ejercicios y simulaciones." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Repaso</title>
    <script>
      // The colour theme before the first paint, so a dark choice never flashes light.
      // Kept in step with src/features/shell/theme.ts.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("repaso-tema");
        } catch (e) {
          /* storage blocked: the system theme applies */
        }
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
